<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Change Password - School Management</title>

    <link
        rel="stylesheet"
        href="/css/login.css"
    >

</head>


<body>

    <div class="form-container">

        <h2>Change Password</h2>

        <p>
            You are using a temporary password.
            Please create a new password before continuing.
        </p>


        <!-- =====================================================
             CHANGE PASSWORD FORM
        ====================================================== -->

        <form id="change-password-form">


            <!-- CURRENT PASSWORD -->

            <div class="input-group">

                <label for="current-password">
                    Temporary Password
                </label>

                <input
                    type="password"
                    id="current-password"
                    placeholder="Enter your temporary password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <!-- NEW PASSWORD -->

            <div class="input-group">

                <label for="new-password">
                    New Password
                </label>

                <input
                    type="password"
                    id="new-password"
                    placeholder="Enter your new password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="input-group">

                <label for="confirm-password">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your new password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- MESSAGE -->

            <div
                id="change-password-message"
                class="error-message"
                style="display:none;"
            ></div>


            <!-- BUTTON -->

            <button
                type="submit"
                id="change-password-btn"
            >
                Change Password
            </button>

        </form>

    </div>


    <script src="../js/config.js"></script>
    <script src="../js/login.js.js"></script>

</body>

</html>
